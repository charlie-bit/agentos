name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # spec #240: a single-language README change is incomplete. Structural
      # comparison (heading skeleton + fence count), not a text diff.
      - name: Bilingual README check
        run: node scripts/check-bilingual.mjs

      # P7b knowledge legislation hook: lint the book socket. Content is
      # gitignored today, so CI lints an EMPTY directory — the step's
      # contract is "lint runs and honestly reports 0 pages", which must be
      # green; the day the book repo is vendored/remote-mounted, the same
      # step guards real content without edits.
      # spec #138/#297: the zero-scaffold test lives in conformance and spawns
      # a real external MCP process — it already runs in `pnpm test` above.
      - name: External provider smoke (opt-in lane)
        if: vars.AGENTOS_EXTERNAL_SMOKE == 'on'
        run: node scripts/fixtures/echo-mcp-server.mjs < /dev/null > /dev/null

      - name: KB lint (book socket)
        run: node cli/main.mjs kb lint knowledge-base --strict
